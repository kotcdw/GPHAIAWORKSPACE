# GPHA Internal Audit Workspace - HTTPS front end on Laragon's Apache.
#
# 1. Copy this file to  C:\laragon\etc\apache2\sites-enabled\gpha-audit.conf
# 2. Replace audit.gpha.gov.gh with the server name, and point the certificate lines at the certificate
#    issued by GPHA IT for that name (or Laragon's own: Menu > Apache > SSL > Add laragon.crt to Trust Store).
# 3. In C:\laragon\bin\apache\<version>\conf\httpd.conf make sure these modules are NOT commented out:
#      mod_ssl, mod_proxy, mod_proxy_http, mod_headers, mod_rewrite
# 4. Laragon: Menu > Apache > Reload.  The app itself runs as the GPHA-Audit Windows service on 127.0.0.1:8001.

<VirtualHost *:80>
    ServerName audit.gpha.gov.gh
    RewriteEngine On
    RewriteRule ^/?(.*)$ https://%{HTTP_HOST}/$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName audit.gpha.gov.gh

    SSLEngine on
    SSLCertificateFile    "C:/laragon/etc/ssl/audit.gpha.gov.gh.crt"
    SSLCertificateKeyFile "C:/laragon/etc/ssl/audit.gpha.gov.gh.key"
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    # Uploads up to 30 MB (the app itself limits working papers to GPHA_MAX_UPLOAD_MB).
    LimitRequestBody 31457280

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 300
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass        / http://127.0.0.1:8001/
    ProxyPassReverse / http://127.0.0.1:8001/

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always unset X-Powered-By
    ServerSignature Off

    ErrorLog  "C:/laragon/logs/gpha-audit-error.log"
    CustomLog "C:/laragon/logs/gpha-audit-access.log" combined
</VirtualHost>
