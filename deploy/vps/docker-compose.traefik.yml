# Use an existing Traefik (for example the one Hostinger's Docker Manager installs) for HTTPS.
# Added by deploy/vps/install.sh when a Traefik container is running.
# Hostinger's Traefik: entrypoint "websecure", certificate resolver "letsencrypt", and it already
# redirects http:// to https:// for every site.
services:
  app:
    labels:
      - traefik.enable=true
      - traefik.docker.network=${GIAW_TRAEFIK_NETWORK:-giaw_default}
      - traefik.http.routers.giaw.rule=Host(`${GIAW_DOMAIN}`) || Host(`www.${GIAW_DOMAIN}`)
      - traefik.http.routers.giaw.entrypoints=${GIAW_TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.giaw.tls=true
      - traefik.http.routers.giaw.tls.certresolver=${GIAW_TRAEFIK_RESOLVER:-letsencrypt}
      - traefik.http.routers.giaw.service=giaw
      - traefik.http.services.giaw.loadbalancer.server.port=8001
